name: Generated files
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: self-hosted-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # pigeon ^22 caps analyzer <8, which cannot parse Dart >=3.10 SDKs.
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run pigeon
        run: |
          dart run pigeon --input pigeons/account_manager.dart
          dart format lib/src/generated/

      - name: Run mockito
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run pigeon and build_runner locally and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
